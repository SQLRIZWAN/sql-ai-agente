name: Build APK

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android NDK & CMake
        # ubuntu-latest runners ship ANDROID_HOME with cmdline-tools; the
        # legacy 'tools' package no longer exists, so skip setup-android and
        # install exactly what the build needs.
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKMANAGER" ] || SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager | head -1)"
          echo "Using sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "ndk;26.3.11579264" "cmake;3.22.1" "platforms;android-35" "build-tools;34.0.0"

      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.SQLAI_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
            echo "Release keystore restored."
          else
            echo "No keystore secret; falling back to debug signing."
          fi

      - name: Build release APK
        env:
          SQLAI_STOREPASS: ${{ secrets.SQLAI_STOREPASS }}
          SQLAI_KEYPASS: ${{ secrets.SQLAI_KEYPASS }}
          SQLAI_KEYALIAS: ${{ secrets.SQLAI_KEYALIAS }}
        run: ./gradlew :app:assembleRelease --console=plain

      - name: Name artifact
        run: |
          mkdir -p dist
          SRC=app/build/outputs/apk/release
          if [ -f "$SRC/app-release.apk" ]; then
            OUT=dist/SQLAI-AGENTE-v${{ github.sha }}-release.apk
            cp "$SRC/app-release.apk" "$OUT"
          else
            OUT=dist/SQLAI-AGENTE-v${{ github.sha }}-unsigned.apk
            cp "$SRC/app-release-unsigned.apk" "$OUT"
          fi
          ls -lh dist/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: sqlai-agente-apk
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 90

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/heads/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-build
          name: Latest Build
          prerelease: true
          make_latest: false
          files: dist/*.apk
          body: |
            Automated build from `${{ github.sha }}`.
            Download the APK from Assets below and install (allow unknown sources).
