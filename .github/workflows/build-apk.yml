name: Build APK

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android NDK & CMake
        # ubuntu-latest runners ship ANDROID_HOME with cmdline-tools; the
        # legacy 'tools' package no longer exists, so skip setup-android and
        # install exactly what the build needs.
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKMANAGER" ] || SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager | head -1)"
          echo "Using sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "ndk;26.3.11579264" "cmake;3.22.1" "platforms;android-35" "build-tools;34.0.0"

      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.SQLAI_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
            echo "Release keystore restored."
          else
            echo "No keystore secret; falling back to debug signing."
          fi

      - name: Build release + debug APK
        env:
          SQLAI_STOREPASS: ${{ secrets.SQLAI_STOREPASS }}
          SQLAI_KEYPASS: ${{ secrets.SQLAI_KEYPASS }}
          SQLAI_KEYALIAS: ${{ secrets.SQLAI_KEYALIAS }}
        run: ./gradlew :app:assembleRelease :app:assembleDebug --console=plain

      - name: Name artifacts (stable names)
        run: |
          mkdir -p dist
          REL=app/build/outputs/apk/release
          DBG=app/build/outputs/apk/debug
          if [ -f "$REL/app-release.apk" ]; then
            cp "$REL/app-release.apk" dist/SQLAI-AGENTE-release.apk
          else
            cp "$REL/app-release-unsigned.apk" dist/SQLAI-AGENTE-release.apk
          fi
          cp "$DBG/app-debug.apk" dist/SQLAI-AGENTE-debug.apk
          (cd dist && zip -j SQLAI-AGENTE-apks.zip SQLAI-AGENTE-release.apk SQLAI-AGENTE-debug.apk)
          ls -lh dist/

      - name: Remove previous assets (always show only the newest build)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          IDS=$(gh api "repos/${{ github.repository }}/releases/tags/latest-build" --jq '.assets[].id' 2>/dev/null)
          for id in $IDS; do
            gh api -X DELETE "repos/${{ github.repository }}/releases/assets/$id" || true
          done
          set -e
          echo "old assets removed"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: sqlai-agente-apk
          path: dist/*
          if-no-files-found: error
          retention-days: 90

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/heads/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-build
          name: Latest Build
          prerelease: true
          make_latest: false
          files: |
            dist/SQLAI-AGENTE-release.apk
            dist/SQLAI-AGENTE-debug.apk
            dist/SQLAI-AGENTE-apks.zip
          body: |
            Automated build from `${{ github.sha }}` — only the **newest** build is kept here.

            | Asset | Use |
            |---|---|
            | `SQLAI-AGENTE-release.apk` | install this (signed, R8 minified) |
            | `SQLAI-AGENTE-debug.apk` | if release crashes (no R8) |
            | `SQLAI-AGENTE-apks.zip` | both APKs in one download |
