name: Build APK

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android NDK & CMake
        # ubuntu-latest runners ship ANDROID_HOME with cmdline-tools; the
        # legacy 'tools' package no longer exists, so skip setup-android and
        # install exactly what the build needs.
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKMANAGER" ] || SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager | head -1)"
          echo "Using sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "ndk;26.3.11579264" "cmake;3.22.1" "platforms;android-35" "build-tools;34.0.0"

      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.SQLAI_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
            echo "Release keystore restored."
          else
            echo "No keystore secret; falling back to debug signing."
          fi

      # Every build gets a strictly increasing versionCode (epoch minutes) so
      # Android treats each APK as an UPDATE of the previously installed one.
      - name: Build release + debug APK
        env:
          SQLAI_STOREPASS: ${{ secrets.SQLAI_STOREPASS }}
          SQLAI_KEYPASS: ${{ secrets.SQLAI_KEYPASS }}
          SQLAI_KEYALIAS: ${{ secrets.SQLAI_KEYALIAS }}
          SQLAI_VERSION_CODE: $(( $(date +%s) / 60 ))
          SQLAI_VERSION_NAME: 1.0.${{ github.run_number }}
        run: ./gradlew :app:assembleRelease :app:assembleDebug --console=plain

      - name: Verify signature + name artifacts
        id: pkg
        run: |
          BT="$ANDROID_HOME/build-tools/34.0.0"
          [ -x "$BT/apksigner" ] || BT="$(find "$ANDROID_HOME/build-tools" -name apksigner -printf '%h\n' | head -1)"
          REL=app/build/outputs/apk/release
          if [ -f "$REL/app-release.apk" ]; then APK="$REL/app-release.apk"; else APK="$REL/app-release-unsigned.apk"; fi
          "$BT/apksigner" verify --verbose "$APK"
          echo "signature OK"
          mkdir -p dist
          cp "$APK" dist/SQLAI-AGENTE-release.apk
          cp app/build/outputs/apk/debug/app-debug.apk dist/SQLAI-AGENTE-debug.apk
          SHA=$(sha256sum dist/SQLAI-AGENTE-release.apk | cut -d' ' -f1)
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"
          ls -lh dist/

      - name: Remove previous assets (always show only the newest build)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          IDS=$(gh api "repos/${{ github.repository }}/releases/tags/latest-build" --jq '.assets[].id' 2>/dev/null)
          for id in $IDS; do
            gh api -X DELETE "repos/${{ github.repository }}/releases/assets/$id" || true
          done
          set -e
          echo "old assets removed"

      - name: Upload debug APK as CI artifact (NOT on release page)
        uses: actions/upload-artifact@v4
        with:
          name: sqlai-agente-debug
          path: dist/SQLAI-AGENTE-debug.apk
          if-no-files-found: error
          retention-days: 90

      - name: Publish GitHub Release (single APK only)
        if: startsWith(github.ref, 'refs/heads/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-build
          name: Latest Build
          prerelease: true
          make_latest: false
          files: dist/SQLAI-AGENTE-release.apk
          body: |
            Newest build only — commit `${{ github.sha }}`, run `${{ github.run_number }}`.

            **Install:** download `SQLAI-AGENTE-release.apk` → install (allow unknown sources).
            If an older/different-signed copy is on the phone, **uninstall it first** (one time).

            **SHA-256:** `${{ steps.pkg.outputs.sha256 }}`

            Debug APK (if release ever misbehaves): CI Artifacts → `sqlai-agente-debug`.
